<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بدون اتصال — Nik Smart Count - Warehousing</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
       background:radial-gradient(120% 120% at 50% 30%,#123a66,#0b2545 55%,#061527);color:#e7eef7;padding:22px}
  .card{max-width:430px;width:100%;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        border-radius:20px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  img{width:118px;height:auto;background:#fff;border-radius:20px;padding:8px;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:13px;line-height:1.9;color:#b9cde0;margin:0 0 18px}
  button{background:#10b981;color:#04231a;border:0;border-radius:10px;padding:11px 20px;font-weight:800;font-size:13px;cursor:pointer}
  small{display:block;margin-top:16px;font-size:11px;color:#8aa3ba}
</style>
</head>
<body>
  <div class="card">
    <img src="uploads/branding/nik-smart-count-logo.png" alt="Nik Smart Count - Warehousing">
    <h1>اتصال به اینترنت قطع است</h1>
    <p>صفحات حسابداری همیشه از دیتابیس زندهٔ سرور خوانده می‌شوند و در حافظهٔ مرورگر ذخیره نمی‌شوند. پس از برقراری اتصال، دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
    <small>Nik Smart Count - Warehousing</small>
  </div>
</body>
</html>
